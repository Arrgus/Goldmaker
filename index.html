<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Goldmaker – Weekly Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="signed-out">
<header>
    <h1>Goldmaker</h1>
    <nav>
        <button data-view="week" class="active">Week</button>
        <button data-view="history">History</button>
        <button data-view="gold">Gold</button>
        <button data-view="manage">Manage</button>
    </nav>
    <button id="nav-total" class="nav-total" data-view="gold" title="All your gold: the bank plus every character. Click to update it." hidden></button>
    <button id="logout" class="link">Log out</button>
</header>

<form id="login-form" class="login" hidden>
    <h2>Sign in</h2>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="login-error" hidden></div>
</form>

<main hidden>
    <section id="view-week">
        <div class="week-nav">
            <button id="prev-week" title="Previous week">&#9664;</button>
            <div>
                <div id="week-label" class="week-label"></div>
                <div id="week-sub" class="muted"></div>
            </div>
            <button id="next-week" title="Next week">&#9654;</button>
            <button id="this-week" class="link">Back to current week</button>
            <div id="week-summary" class="summary"></div>
        </div>
        <div id="grid"></div>
    </section>

    <section id="view-history" hidden>
        <div id="history"></div>
    </section>

    <section id="view-gold" hidden>
        <div id="gold"></div>
    </section>

    <section id="view-manage" hidden>
        <div class="manage">
            <div class="panel">
                <h2>Characters</h2>
                <div id="sync" class="sync" hidden>
                    <button type="button" id="sync-btn">Sync with Armory</button>
                    <span id="sync-status" class="muted"></span>
                </div>
                <form id="char-form">
                    <input type="hidden" name="id">
                    <label class="field grow"><span>Name</span><input name="name" required></label>
                    <label class="field grow"><span>Realm</span><input name="realm" placeholder="optional, e.g. ColinasPardas"></label>
                    <label class="field"><span>Class</span><select name="class"></select></label>
                    <label class="field"><span>Level</span><input name="level" type="number" min="1" max="90" value="80"></label>
                    <div class="form-buttons">
                        <button type="submit">Add</button>
                        <button type="button" class="cancel link" hidden>Cancel</button>
                    </div>
                </form>
                <ul id="char-list" class="list"></ul>
            </div>
            <div class="panel">
                <h2>Activities</h2>
                <form id="act-form">
                    <input type="hidden" name="id">
                    <label class="field grow"><span>Activity</span><input name="name" required></label>
                    <label class="field"><span>Level</span>
                        <select name="minLevel">
                            <option value="80">80+</option>
                            <option value="90">Max level (90)</option>
                            <option value="1">Any level</option>
                        </select>
                    </label>
                    <label class="field"><span>Gold</span><input name="gold" type="number" min="0" step="100" placeholder="typical"
                           title="Typical gold reward. For an activity with loot, the gold from vendored items."></label>
                    <label class="field wide"><span>Notes</span><input name="notes" placeholder="optional, shown when hovering the column"></label>
                    <label class="field wide"><span>Loot sold on the Auction House</span><input name="materials"
                           placeholder="optional, comma-separated, e.g. Wartorn Scrap, Frozen Rune"
                           title="Each material gets a column on the Week page, next to the activity, with its price per item."></label>
                    <div class="form-buttons">
                        <button type="submit">Add</button>
                        <button type="button" class="cancel link" hidden>Cancel</button>
                    </div>
                </form>
                <ul id="act-list" class="list"></ul>
            </div>
            <div class="panel">
                <h2>Data</h2>
                <p class="muted">Replace all characters, activities and history with a <b>goldmaker.json</b> file.
                    The current data is kept as a backup file on the server.</p>
                <button type="button" id="import-btn">Import goldmaker.json…</button>
                <input type="file" id="import-file" accept=".json,application/json" hidden>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
